<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Starry Night Sky — Twinkle, Soothing Flow & Random Comet</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin:0; height:100%; background:#08142d; overflow:hidden; }
  canvas#sky { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<script>
/* ===================================
   Random & Palette
   =================================== */
function RNG(seed=1889){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0, (s&0xfffffff)/0x10000000); }
let seed = 1889, rand = RNG(seed);
const rnd  = (a=0,b=1)=>a+(b-a)*rand();
const pick = arr => arr[(rand()*arr.length)|0];

const PAL = {
  deep:   ['#081739','#0a1e4d','#0b235a'],
  light:  ['#183f8f','#1f4fa8','#285dc0'],
  stroke: ['#143270','#193e88','#224fa4','#2a5cbd'],
  hi:     ['#7fa6e6','#a8c2f1','#d6e4fb'],
  moonCore: '#ffefb6',
  moonGlow: 'rgba(255,210,90,0.18)',
  starCore: 'rgba(255,246,204,0.70)',
  cometCore: 'rgba(255,255,255,0.9)',
  cometTail: 'rgba(180,220,255,0.30)',
  bgLow:   '#07122c',
  bgHigh:  '#0a1a46'
};

/* ===================================
   Color helpers (HEX in, RGBA out)
   =================================== */
const hex2rgb = (h)=>{
  const x = h.replace('#','');
  const n = x.length===3
    ? x.split('').map(c=>parseInt(c+c,16))
    : [x.slice(0,2),x.slice(2,4),x.slice(4,6)].map(s=>parseInt(s,16));
  return {r:n[0], g:n[1], b:n[2]};
};
const lerp = (a,b,t)=>a+(b-a)*t;
const mixHexRGBA = (ha,hb,t,alpha=1)=>{
  const a=hex2rgb(ha), b=hex2rgb(hb);
  const r=Math.round(lerp(a.r,b.r,t));
  const g=Math.round(lerp(a.g,b.g,t));
  const bl=Math.round(lerp(a.b,b.b,t));
  return `rgba(${r},${g},${bl},${alpha})`;
};

/* ===================================
   Canvas setup
   =================================== */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d', { alpha:false });
let DPR=1, W=1, H=1;
function fitCanvas(){
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio||1));
  const cssW = Math.floor(window.innerWidth);
  const cssH = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(cssW*DPR);
  canvas.height = Math.floor(cssH*DPR);
  canvas.style.width  = cssW+'px';
  canvas.style.height = cssH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W=cssW; H=cssH;
}

/* ===================================
   Smooth Flow Field
   =================================== */
function makeField(){
  const R = Math.min(W,H);
  const vortices = [
    {cx:0.60*W, cy:0.35*H, s: 0.95, r:0.48*R},
    {cx:0.42*W, cy:0.36*H, s:-0.65, r:0.38*R},
    {cx:0.80*W, cy:0.20*H, s: 0.48, r:0.32*R}
  ];
  const bands = [
    {yc:0.28*H, amp:36,  freq:0.010, ph:0.6, dec:0.0020},
    {yc:0.36*H, amp:46,  freq:0.009, ph:1.1, dec:0.0023},
    {yc:0.44*H, amp:30,  freq:0.012, ph:2.0, dec:0.0025}
  ];

  function V_raw(x,y,t){
    let vx=0, vy=0;
    for (const v of vortices){
      const cx = v.cx + Math.sin(t*0.035 + v.cx*1e-4)*2.0;
      const cy = v.cy + Math.cos(t*0.032 + v.cy*1e-4)*1.8;
      const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy)+1e-6;
      const fall=Math.exp(-(d/v.r));
      const tx=-dy/d, ty=dx/d;
      vx += tx*v.s*fall; vy += ty*v.s*fall;
    }
    for (const b of bands){
      const yc = b.yc + Math.sin(t*0.028 + b.yc*2e-4)*4.0;
      const k  = Math.exp(-(y-yc)*(y-yc)*b.dec);
      const ang= Math.sin(x*b.freq + b.ph + t*0.055) * b.amp * k;
      vx += 0.48 + 0.0011*ang;
      vy += 0.0019*ang;
    }
    vy -= 0.00036*(y-0.36*H);
    const m=Math.hypot(vx,vy)||1;
    return [vx/m, vy/m];
  }

  const eps = 6;
  function V(x,y,t){
    const a = V_raw(x,y,t);
    const b = V_raw(x+eps,y,t);
    const c = V_raw(x-eps,y,t);
    const d = V_raw(x,y+eps,t);
    const e = V_raw(x,y-eps,t);
    let vx = (a[0]+b[0]+c[0]+d[0]+e[0])/5;
    let vy = (a[1]+b[1]+c[1]+d[1]+e[1])/5;
    const m=Math.hypot(vx,vy)||1;
    return [vx/m, vy/m];
  }

  function advect(x,y,dt,t){
    const [vx1,vy1] = V(x,y,t);
    const mx = x + vx1*dt*0.5*W;
    const my = y + vy1*dt*0.5*W;
    const [vx2,vy2] = V(mx,my,t+dt*0.5);
    return [x + vx2*dt*W, y + vy2*dt*W, vx2, vy2];
  }

  return { V, advect };
}

/* ===================================
   Particle strokes (soothing colors)
   =================================== */
class Particle {
  constructor(layer){ this.layer=layer; this.reset(true); }
  reset(randPos=false){
    this.x = randPos ? rnd(0, W) : (Math.random()<0.5 ? -0.02*W : 1.02*W);
    this.y = rnd(0.11*H, 0.60*H);
    this.len = this.layer.baseLen * rnd(0.95,1.10);
    this.w   = this.layer.baseW   * rnd(0.95,1.08);
    this.alphaBase = this.layer.alpha * rnd(0.85,1.15);
    this.cA = pick(this.layer.colsA);
    this.cB = pick(this.layer.colsB);
    this.life = rnd(2.2, 4.2);
    this.age  = rnd(0, this.life);
    this.phase = rnd(0, 1);
    this.vx = 0; this.vy = 0;
  }
  step(dt, flow, t){
    this.age += dt;
    if (this.age > this.life) this.reset(true);
    const [nx,ny,vx,vy] = flow.advect(this.x, this.y, dt*this.layer.speed, t);
    this.x = nx; this.y = ny;
    if (this.x < -0.03*W) this.x += 1.06*W;
    if (this.x >  1.03*W) this.x -= 1.06*W;
    if (this.y <  0.06*H) this.y += 0.58*H;
    if (this.y >  0.66*H) this.y -= 0.58*H;
    this.vx=vx; this.vy=vy;
    const spd = Math.hypot(vx,vy);
    this.phase = (this.phase + dt*(0.05 + 0.10*spd)) % 1;
  }
  draw(ctx){
    const tx = this.vx*this.len, ty=this.vy*this.len;
    const cx = this.x + tx*0.55, cy = this.y + ty*0.55;
    const t  = 0.5 + 0.5*Math.sin(this.phase*2*Math.PI);

    const grad = ctx.createLinearGradient(this.x, this.y, this.x+tx, this.y+ty);
    grad.addColorStop(0, mixHexRGBA(this.cA, this.cB, 0.6*t, 1.0));
    grad.addColorStop(1, mixHexRGBA(this.cB, pick(PAL.hi), 0.4*t, 1.0));

    ctx.globalAlpha = this.alphaBase * (0.85 + 0.15*t);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.w * (0.9 + 0.1*t);
    ctx.lineCap   = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.quadraticCurveTo(cx, cy, this.x + tx, this.y + ty);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* ===================================
   Stars & Moon (slow twinkle)
   =================================== */
const sky = { stars: [], moon:{ x:0.83, y:0.18, baseR:0.030 } };

function makeStars(){
  sky.stars = [];
  const total = 90;
  for (let i=0;i<total;i++){
    sky.stars.push({
      x: rnd(0.1*W,0.9*W),
      y: rnd(0.1*H,0.5*H),
      r: rnd(2,5),
      tw: rnd(0.10,0.22),
      ph: rnd(0,Math.PI*2),
      amp: rnd(0.30,0.60),
      spark: rnd(0.005,0.015)
    });
  }
}
function drawStars(t){
  const hash01 = x => ((Math.sin(x*12.9898+78.233)*43758.5453)%1+1)%1;
  for(const s of sky.stars){
    const tw = 0.5+0.5*Math.sin(t*s.tw+s.ph);
    const h = hash01(t*0.4+s.ph*2.1);
    const spark = h<s.spark?(1-h/s.spark):0;
    const bright=0.6+0.4*s.amp*tw+0.8*spark;
    const rr=s.r*(0.9+0.2*tw+0.6*spark);

    ctx.globalCompositeOperation='lighter';
    const halo=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,rr*7);
    halo.addColorStop(0,`rgba(255,240,160,${0.10*bright})`);
    halo.addColorStop(1,'rgba(255,220,100,0)');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(s.x,s.y,rr*7,0,Math.PI*2);ctx.fill();

    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=PAL.starCore;ctx.globalAlpha=0.35*bright;
    ctx.beginPath();ctx.arc(s.x,s.y,rr,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
}

/* ===================================
   Comet (random)
   =================================== */
class Comet {
  constructor(){ this.active=false; this.path=[]; }
  spawn(){
    // spawn from random edge, move inward-ish with random angle
    const edge = (rand()*4)|0; // 0: left, 1: right, 2: top, 3: bottom
    const margin = 60;
    if (edge===0){ this.x=-margin; this.y=rnd(0.1*H,0.6*H); }
    else if (edge===1){ this.x=W+margin; this.y=rnd(0.1*H,0.6*H); }
    else if (edge===2){ this.x=rnd(0.1*W,0.9*W); this.y=-margin; }
    else { this.x=rnd(0.1*W,0.9*W); this.y=H+margin; }

    const targetX = rnd(0.2*W,0.8*W);
    const targetY = rnd(0.15*H,0.55*H);
    const ang = Math.atan2(targetY - this.y, targetX - this.x) + rnd(-0.25,0.25);
    const speed = rnd(420, 640); // px/s (looks swift but not frantic)

    this.vx = Math.cos(ang) * speed;
    this.vy = Math.sin(ang) * speed;

    this.life = rnd(1.8, 2.6);
    this.age  = 0;
    this.active = true;
    this.path.length = 0; // reset trail
  }
  step(dt){
    if(!this.active) return;
    this.age += dt;
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    // store a short trail of positions
    this.path.push({x:this.x, y:this.y});
    if (this.path.length > 16) this.path.shift();
    if (this.age >= this.life) this.active=false;
  }
  draw(ctx){
    if(!this.active) return;
    const t = this.age/this.life; // 0..1
    const headAlpha = (1-t)*0.95;
    const tailAlpha = 0.30;

    // draw tail as polyline with gradient alpha
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    for (let i=this.path.length-1; i>0; i--){
      const p1 = this.path[i], p0 = this.path[i-1];
      const segT = i / this.path.length;
      ctx.strokeStyle = PAL.cometTail;
      ctx.globalAlpha = tailAlpha * segT * (1-t);
      ctx.lineWidth = 2 + 3*segT;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    // head
    ctx.globalAlpha = headAlpha;
    ctx.fillStyle = PAL.cometCore;
    ctx.beginPath(); ctx.arc(this.x, this.y, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation='source-over';
  }
}
const comet = new Comet();
let cometCooldown = rnd(1,2); // seconds until next spawn

/* ===================================
   Background & Moon
   =================================== */
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, PAL.bgHigh);
  g.addColorStop(1, PAL.bgLow);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}
function drawMoon(t){
  const mx = sky.moon.x*W, my = sky.moon.y*H;
  const coreR = Math.max(22, sky.moon.baseR*Math.min(W,H)) * (1 + Math.sin(t*0.35)*0.012);
  const glowR = Math.max(86, 0.16*Math.min(W,H)) * (1 + Math.sin(t*0.28+0.6)*0.012);

  ctx.globalCompositeOperation='lighter';
  const rg = ctx.createRadialGradient(mx,my,0, mx,my, glowR);
  rg.addColorStop(0, PAL.moonGlow);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(mx,my,glowR,0,Math.PI*2); ctx.fill();

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = PAL.moonCore;
  ctx.globalAlpha = 0.78;
  ctx.beginPath(); ctx.arc(mx,my,coreR,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ===================================
   Scene Build
   =================================== */
let flow=null, particles=[];
function build(){
  fitCanvas();
  flow = makeField();
  const baseLen = Math.max(22, 0.026*Math.min(W,H));
  const baseW   = Math.max(1.0, 0.0014*Math.min(W,H));
  const area    = W*H;
  const baseN   = Math.max(800, Math.round(area/2600));

  const L0 = { baseLen: baseLen*1.00, baseW: baseW*1.00, speed: 0.14, colsA: PAL.stroke, colsB: PAL.light, alpha: 0.33 };
  const L1 = { baseLen: baseLen*1.22, baseW: baseW*1.08, speed: 0.24, colsA: PAL.light,  colsB: PAL.hi,    alpha: 0.26 };
  const L2 = { baseLen: baseLen*1.42, baseW: baseW*1.12, speed: 0.32, colsA: PAL.stroke, colsB: PAL.hi,    alpha: 0.22 };

  particles = [];
  for (let i=0;i<Math.round(baseN*0.95); i++) particles.push(new Particle(L0));
  for (let i=0;i<Math.round(baseN*0.80); i++) particles.push(new Particle(L1));
  for (let i=0;i<Math.round(baseN*0.65); i++) particles.push(new Particle(L2));

  makeStars();

  // Reset comet on resize/rebuild
  comet.active = false;
  cometCooldown = rnd(4, 12);
}

/* ===================================
   Animation
   =================================== */
let last=0, time=0;
function loop(ts){
  if (!last) last = ts;
  const dt = Math.min(0.025, (ts-last)/1000);
  last = ts; time += dt;

  // spawn comet when ready
  if (!comet.active){
    cometCooldown -= dt;
    if (cometCooldown <= 0){
      comet.spawn();
      cometCooldown = rnd(10, 25);
    }
  }

  drawBackground();
  drawStars(time);
  drawMoon(time);

  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    p.step(dt, flow, time);
    p.draw(ctx);
  }

  comet.step(dt);
  comet.draw(ctx);

  // vignette
  const vg = ctx.createRadialGradient(W/2, H*0.42, Math.min(W,H)*0.40, W/2, H*0.52, Math.max(W,H)*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(loop);
}

/* ===================================
   Init & Resize
   =================================== */
build(); requestAnimationFrame(loop);
let resizeTimer=null;
addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ build(); },120); });
addEventListener('keydown', (e)=>{
  const k = e.key.toLowerCase();
  if (k==='r'){ seed=(Math.random()*1e9)|0; rand=RNG(seed); build(); }
});
</script>
</body>
</html>
