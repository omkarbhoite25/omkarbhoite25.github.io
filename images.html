<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Omkar Bhoite">
  <meta name="description" content="Omkar Bhoite - Photography portfolio showcasing travel and landscape photography.">

  <title>Photography | Omkar Bhoite</title>

  <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">

  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Additional gallery styles -->
  <style>
    .gallery-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .gallery-masonry {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .gallery-masonry {
        grid-template-columns: repeat(3, 1fr);
        max-width: 900px;
      }
    }

    @media (min-width: 1024px) {
      .gallery-masonry {
        grid-template-columns: repeat(4, 1fr);
        max-width: 1100px;
      }
    }

    .gallery-item {
      position: relative;
      overflow: visible;
      border-radius: var(--radius-md);
      background: transparent;
      perspective: 1000px;
      transform-style: preserve-3d;
      aspect-ratio: 1;
      max-width: 250px;
      margin: 0 auto;
      width: 100%;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease, opacity 0.5s ease;
      cursor: pointer;
      border-radius: var(--radius-md);
      will-change: transform;
      backface-visibility: hidden;
    }

    .gallery-item:hover img {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    /* Swap animation */
    .gallery-item.swapping img {
      opacity: 0;
      transform: scale(0.8) rotateY(90deg);
    }

    .gallery-item.swap-in img {
      animation: swapIn 0.5s ease-out forwards;
    }

    @keyframes swapIn {
      0% {
        opacity: 0;
        transform: scale(0.8) rotateY(-90deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotateY(0deg);
      }
    }

    /* Glow effect during swap */
    .gallery-item.swapping::before {
      content: '';
      position: absolute;
      inset: -4px;
      background: linear-gradient(45deg, #06b6d4, #8b5cf6, #ec4899, #06b6d4);
      background-size: 300% 300%;
      border-radius: calc(var(--radius-md) + 4px);
      z-index: -1;
      animation: glowPulse 1s ease infinite;
      opacity: 0.8;
    }

    @keyframes glowPulse {
      0%, 100% { background-position: 0% 50%; opacity: 0.8; }
      50% { background-position: 100% 50%; opacity: 1; }
    }

    /* Mobile: disable tilt, just scale */
    @media (max-width: 768px) {
      .gallery-item:hover img {
        transform: scale(1.02) !important;
      }

      .gallery-item {
        max-width: 180px;
      }
    }

    /* Tall items span 2 rows but keep width consistent */
    .gallery-item--tall {
      grid-row: span 2;
      aspect-ratio: 1/2;
      max-width: 250px;
    }

    @media (max-width: 768px) {
      .gallery-item--tall {
        max-width: 180px;
      }
    }

    /* Lightbox styles */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: var(--radius-full);
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>

</head>

<body>
  <!-- Background Canvas -->
  <div class="canvas-container">
    <canvas id="light-bg" class="background-canvas"></canvas>
  </div>

  <!-- Portal Toggle Button -->
  <div class="portal-container" id="portal-container">
    <button class="portal-button" id="portal-btn" aria-label="Toggle content visibility">
      <div class="portal-ring portal-ring-1"></div>

  <!-- Navigation -->
  <nav class="navbar content-hidden">

        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="navbar-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="physics.html" class="nav-link">Physics</a>
        <a href="startup.html" class="nav-link">Startups</a>
        <a href="images.html" class="nav-link active">Photography</a>
        <div class="theme-toggle" id="theme-toggle" role="button" aria-label="Toggle dark mode">
          <div class="theme-toggle-track">

    </div>

  <!-- Main Content -->
  <main class="main-content content-hidden">
    <div class="container">

      <!-- Page Header -->
      <header class="page-header">
        <h1>Photography</h1>
      </header>

      <!-- Gallery Section -->
      <section class="section">
        <div class="gallery-wrapper">
        <div class="gallery-masonry">
          <div class="gallery-item">
            <img src="images/c.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/b.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/a.png" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/d.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item gallery-item--tall">
            <img src="images/h.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/i.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/e.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item gallery-item--tall">
            <img src="images/f.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/j.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/k.JPG" alt="Photography" loading="lazy">
          </div>
          <div class="gallery-item">
            <img src="images/g.JPG" alt="Photography" loading="lazy">
          </div>
        </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <img src="" alt="Full size image">
  </div>

  <!-- Spaceship Launch Button -->
  <div class="launch-button-container content-hidden">
    <button class="launch-button" id="launch-btn" aria-label="Launch Spaceship">
      <svg class="launch-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
      </svg>
      <span>Launch Ship</span>
    </button>
  </div>

  <!-- JavaScript -->
  <script src="js/light-canvas.js"></script>
  <script src="js/lazy-load.js"></script>
  <script src="js/cursor.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize and start solar system canvas
      LightCanvas.init('light-bg');
      LightCanvas.start();

      // Portal toggle functionality
      const portalContainer = document.getElementById('portal-container');
      const portalBtn = document.getElementById('portal-btn');
      const portalText = document.getElementById('portal-text');
      const navbar = document.querySelector('.navbar');
      const mainContent = document.querySelector('.main-content');
      const launchContainer = document.querySelector('.launch-button-container');

      let contentVisible = sessionStorage.getItem('contentVisible') === 'true';

      function showContent(animate = true) {
        document.body.style.overflow = ''; // Restore scrolling
        if (animate) {
          navbar.classList.remove('content-hidden');
          navbar.classList.add('content-visible');
          setTimeout(() => {
            mainContent.classList.remove('content-hidden');
            mainContent.classList.add('content-visible');
          }, 150);
          setTimeout(() => {
            launchContainer.classList.remove('content-hidden');
            launchContainer.classList.add('content-visible');
          }, 300);
        } else {
          // Instant show without animation
          navbar.classList.remove('content-hidden');
          navbar.classList.add('content-visible');
          mainContent.classList.remove('content-hidden');
          mainContent.classList.add('content-visible');
          launchContainer.classList.remove('content-hidden');
          launchContainer.classList.add('content-visible');
        }
      }

      function hideContent() {
        document.body.style.overflow = 'hidden'; // Hide scrollbar
        launchContainer.classList.remove('content-visible');
        launchContainer.classList.add('content-hidden');
        setTimeout(() => {
          mainContent.classList.remove('content-visible');
          mainContent.classList.add('content-hidden');
        }, 150);
        setTimeout(() => {
          navbar.classList.remove('content-visible');
          navbar.classList.add('content-hidden');
        }, 300);
      }

      function minimizePortal() {
        portalContainer.classList.add('minimized');
      }

      function expandPortal() {
        portalContainer.classList.remove('minimized');
      }

      // Initialize state - if already entered, show content immediately without animation
      if (contentVisible) {
        showContent(false); // No animation for returning visitors
        minimizePortal();
        portalText.textContent = 'EXIT';
      } else {
        document.body.style.overflow = 'hidden'; // Hide scrollbar when portal is shown
      }

      portalBtn.addEventListener('click', function() {
        portalBtn.classList.add('activating');
        setTimeout(() => portalBtn.classList.remove('activating'), 800);

        if (contentVisible) {
          hideContent();
          expandPortal();
          portalText.textContent = 'ENTER';
          contentVisible = false;
          sessionStorage.setItem('contentVisible', 'false');
        } else {
          setTimeout(() => {
            showContent(true);
            minimizePortal();
            portalText.textContent = 'EXIT';
            contentVisible = true;
            sessionStorage.setItem('contentVisible', 'true');
          }, 400);
        }
      });

      // Mobile nav toggle
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.navbar-nav');

      navToggle.addEventListener('click', function() {
        const isOpen = navMenu.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', isOpen);
      });

      // Close mobile nav when clicking a link
      navMenu.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });

      // Lightbox functionality
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = lightbox.querySelector('img');
      const lightboxClose = lightbox.querySelector('.lightbox-close');

      document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', function() {
          lightboxImg.src = this.src;
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        });
      });

      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox || e.target === lightboxClose) {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      // Theme toggle
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;

      // Check for saved theme preference
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          LightCanvas.setDarkMode(true);
        }
      }

      themeToggle.addEventListener('click', function() {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        LightCanvas.setDarkMode(newTheme === 'dark');
      });

      // Spaceship launch button (toggle)
      const launchBtn = document.getElementById('launch-btn');
      if (launchBtn) {
        if (sessionStorage.getItem('spaceshipLaunched') === 'true') {
          launchBtn.classList.add('launched');
          launchBtn.querySelector('span').textContent = 'Stop Ship';
          LightCanvas.launchSpaceship();
        }

        launchBtn.addEventListener('click', function() {
          const isLaunched = LightCanvas.toggleSpaceship();
          if (isLaunched) {
            launchBtn.classList.add('launched');
            launchBtn.querySelector('span').textContent = 'Stop Ship';
            sessionStorage.setItem('spaceshipLaunched', 'true');
          } else {
            launchBtn.classList.remove('launched');
            launchBtn.querySelector('span').textContent = 'Launch Ship';
            sessionStorage.setItem('spaceshipLaunched', 'false');
          }
        });
      }

      // 3D Tilt Effect for Gallery Items
      const isMobile = window.matchMedia('(max-width: 768px)').matches;

      if (!isMobile) {
        const galleryItems = document.querySelectorAll('.gallery-item');
        const maxTilt = 15; // Maximum tilt angle in degrees

        galleryItems.forEach(item => {
          const img = item.querySelector('img');

          item.addEventListener('mousemove', function(e) {
            const rect = item.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Calculate tilt angles
            const tiltX = ((y - centerY) / centerY) * -maxTilt;
            const tiltY = ((x - centerX) / centerX) * maxTilt;

            // Apply transform with slight lift
            img.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(10px) scale(1.02)`;

            // Dynamic shadow based on tilt direction
            const shadowX = -tiltY * 1.5;
            const shadowY = tiltX * 1.5;
            img.style.boxShadow = `${shadowX}px ${shadowY + 20}px 40px rgba(0, 0, 0, 0.25)`;
          });

          item.addEventListener('mouseleave', function() {
            // Smooth reset animation
            img.style.transition = 'transform 0.4s ease-out, box-shadow 0.4s ease-out';
            img.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1)';
            img.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.1)';

            // Reset transition for mousemove responsiveness
            setTimeout(() => {
              img.style.transition = 'transform 0.15s ease-out, box-shadow 0.3s ease';
            }, 400);
          });

          item.addEventListener('mouseenter', function() {
            img.style.transition = 'transform 0.15s ease-out, box-shadow 0.3s ease';
          });
        });
      }

      // Auto-swap animation for gallery images
      const galleryImages = document.querySelectorAll('.gallery-item');
      const imageSources = Array.from(galleryImages).map(item => item.querySelector('img').src);
      let isSwapping = false;

      function getRandomPair() {
        const indices = [];
        while (indices.length < 2) {
          const idx = Math.floor(Math.random() * galleryImages.length);
          if (!indices.includes(idx)) {
            indices.push(idx);
          }
        }
        return indices;
      }

      function swapImages() {
        if (isSwapping) return;
        isSwapping = true;

        const [idx1, idx2] = getRandomPair();
        const item1 = galleryImages[idx1];
        const item2 = galleryImages[idx2];
        const img1 = item1.querySelector('img');
        const img2 = item2.querySelector('img');

        // Store current sources
        const src1 = img1.src;
        const src2 = img2.src;

        // Add swapping class (fade out + rotate)
        item1.classList.add('swapping');
        item2.classList.add('swapping');

        // After fade out, swap sources and fade in
        setTimeout(() => {
          img1.src = src2;
          img2.src = src1;

          // Remove swapping, add swap-in
          item1.classList.remove('swapping');
          item2.classList.remove('swapping');
          item1.classList.add('swap-in');
          item2.classList.add('swap-in');

          // Clean up classes
          setTimeout(() => {
            item1.classList.remove('swap-in');
            item2.classList.remove('swap-in');
            isSwapping = false;
          }, 500);
        }, 500);
      }

      // Start auto-swap every 4 seconds
      setInterval(swapImages, 4000);

      // Also swap on initial load after a delay
      setTimeout(swapImages, 2000);
    });
  </script>
</body>
</html>
