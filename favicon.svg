<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Mars gradient - reddish orange tones -->
    <radialGradient id="marsGradient" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="40%" stop-color="#d4724a"/>
      <stop offset="70%" stop-color="#c1512d"/>
      <stop offset="100%" stop-color="#8b3a1d"/>
    </radialGradient>
    <!-- Shadow gradient -->
    <radialGradient id="shadow" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>

  <!-- Main Mars sphere -->
  <circle cx="50" cy="50" r="45" fill="url(#marsGradient)"/>

  <!-- Surface features - darker regions -->
  <ellipse cx="35" cy="40" rx="12" ry="8" fill="#a84832" opacity="0.6"/>
  <ellipse cx="60" cy="55" rx="15" ry="10" fill="#a84832" opacity="0.5"/>
  <ellipse cx="45" cy="65" rx="8" ry="5" fill="#9c4025" opacity="0.5"/>
  <circle cx="30" cy="58" r="6" fill="#a84832" opacity="0.4"/>

  <!-- Polar ice cap hint -->
  <ellipse cx="50" cy="12" rx="18" ry="6" fill="#f5e6d3" opacity="0.7"/>

  <!-- Shadow overlay for 3D effect -->
  <circle cx="50" cy="50" r="45" fill="url(#shadow)"/>

  <!-- Highlight for shine -->
  <ellipse cx="32" cy="30" rx="8" ry="6" fill="white" opacity="0.2"/>
</svg>
